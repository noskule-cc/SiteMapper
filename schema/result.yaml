# Schema: Workflow Result
# The neutral, sink-agnostic object a workflow run emits. SiteMapper RETURNS this
# to the caller; it never pushes it anywhere. The host (an LLM agent or a Python
# program) routes it to a destination (Azure DevOps, Jira, a file, a DB) via its
# own adapter. See docs/interface.md.

result:
  workflow: ""                # Name of the workflow that ran
  site: ""                    # Site the run targeted: the tier's site for a
                              # workflow with `tiers`, else its first site
  tier: ""                    # The tier the run targeted, or "-" (schema/app.yaml)
  status: ""                  # passed | failed | error | waiting
                              #   passed  - ran to completion, all assertions passed
                              #   failed  - ran to completion, >= 1 assertion failed
                              #   error   - could not complete (element not found,
                              #             navigation/timeout, etc.)
                              #   waiting - stopped at a `human` step with every
                              #             assertion so far passed; teardown skipped.
                              #             Not a failure: trust is unchanged, exit 0
  class: ""                   # What the outcome means for the map. Additive: a host
                              # that reads only `status` keeps working.
                              #   ok      - passed or waiting, no drift
                              #   input   - a parameter, persona, context or workflow
                              #             name the caller gave is missing or wrong
                              #   refused - policy or the runner refused the run
                              #             (deny, ask without consent, agentic mode,
                              #             undeclared effect)
                              #   auth    - the persona could not get a session: no or
                              #             expired saved state, a missing secret, a
                              #             rejected login
                              #   drift   - the page is not what the map says: an
                              #             element that never appeared or the browser
                              #             could not act on, a page or element the
                              #             map lacks, a table without the header or
                              #             row, a field that reverts its value, a
                              #             fingerprint mismatch. Also on the login
                              #             page: its map is broken, not the login
                              #   assert  - the run completed and an assertion failed
                              #   error   - anything else the runner hit (a script that
                              #             exited non-zero, a navigation error)
                              # Only drift and assert set the workflow's trust to broken.
  next: ""                    # The one next step for this class, e.g.
                              # "/repair search-issues" or
                              # "run nap again with --param size=...". Empty when ok.
  waiting_for: {}             # Set when status == waiting: the person step the run
                              # stopped at, {step, label, reason} (schema/workflow.yaml)
  started_at: ""              # ISO-8601 timestamp (set by the runner/host)
  finished_at: ""             # ISO-8601 timestamp

  parameters: {}              # Parameter values used for this run
  fixtures: {}                # Fixture values used for this run

  captures: {}                # Values read from the UI by `read` steps,
                              # keyed by the step's capture name, e.g.:
                              #   captures:
                              #     bestehender_count: "121"

  snapshot: {}                # The captures of the `snapshot:` phase, the
                              # pre-state of a `rollback: snapshot` workflow.
                              # Also in `captures`; kept apart so a record can
                              # write them as the rollback copy (schema/run.yaml)

  assertions:                 # One entry per `assert` step
    - id: ""                  # Stable id (defaults to "<page>.<element>.<expect>")
      page: ""                # Page the assertion targeted
      element: ""             # Element the assertion targeted
      expect: null            # The expected condition (mirrors the step's expect)
      actual: null            # What was observed
      pass: false             # true if actual satisfied expect
      message: ""             # Optional detail (esp. on failure)

  evidence: []                # Optional artifact paths (e.g. screenshots) captured
                              # during the run, relative to the repo

  fingerprints: {}            # Watch (#24): per-page fingerprint outcome, ok | mismatch,
                              # for every fingerprinted page the run arrived at. Same
                              # drift vocabulary as /verify-map. A mismatch makes the
                              # class drift and degrades the workflow's `trust` to
                              # broken in its YAML.

  trust_change: ""            # Set when this run downgraded the workflow's trust,
                              # e.g. "draft -> broken". Its run record then gets
                              # keep: keep (schema/run.yaml).
  error: ""                   # Populated when status == error: what went wrong. A run
                              # refused before its first step still prints a result
                              # with --json: status error, its class and next, no
                              # steps, no run record, exit code 2.

  failure:                    # Populated by the headless runner when status == error —
                              # everything the repair loop (the repair skill) needs to fix
                              # the map without re-exploring. Absent on passed; on failed
                              # it holds only class, next and replay.
    phase: ""                 #   setup | steps | teardown
    step_index: 0             #   0-based index of the failing step in that phase
    action: ""                #   the step's action
    description: ""           #   the step's description
    page: ""                  #   page the step targeted
    element: ""               #   element name from the page map
    locator: {}               #   the locator AS TRIED: {strategy, value}
    resolved_values: {}       #   $variables as resolved for this step
    url: ""                   #   actual URL at failure time
    page_title: ""            #   actual document title at failure time
    fingerprint: ""           #   ok | mismatch | unchecked — the target page's
                              #   fingerprint state at failure time
    screenshot: ""            #   failure screenshot — a LOCAL, gitignored path
                              #   (.runner/); referenced, never committed
    class: ""                 #   the result's class, repeated for the repair loop
    next: ""                  #   the result's next step
    replay: {}                #   Set when the class was drift or assert: the fixture
                              #   replay that tells drift from missing data, run once
                              #   through the same gate and recorded in this run.
                              #   status: passed  - the fixtures passed, so the class
                              #                     became input and trust is unchanged
                              #           failed  - the class stands, trust is broken
                              #           refused - the gate refused the replay; the
                              #                     class stands
                              #           skipped - not eligible; the class stands
                              #   reason: why skipped or refused (mutating or
                              #           destructive effect, a human step, no
                              #           fixtures, the run already used them)
                              #   inputs: the parameters the replay set to fixtures
                              #   class, error, counts, started_at, finished_at:
                              #           the replay's own, when it ran

# Summary convenience (a runner may also include):
#   counts: { total: N, passed: N, failed: N }
