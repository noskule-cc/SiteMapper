# Schema: Run Record
# What the headless runner writes when a run is recorded (--record, or always
# when the workflow declares `rollback: snapshot`). One folder per run:
#
#   <runs>/SiteMapper/<owner>/<workflow>.<YYYY-MM-DDTHHMMSS.fffZ>.<tier>.<instance>.<suffix>/
#     run.yaml          this record
#     result.json       the full `result` object (schema/result.yaml)
#     snapshot/         captures of the `snapshot:` phase, one JSON file each
#     evidence/         screenshots and files the run produced
#
# <runs> is the runs root (scripts/tree.py): `runs/` beside the lib's tree in a
# deployment's data tree, or inside the framework repo. It is produced data —
# gitignored as a class, never committed. <owner> is the project's path under
# projects/ or the site's name. <tier> is `-` when the workflow declares no
# tiers. The instance in the folder name is what keeps two machines' runs
# apart; a sync copies folders and never merges them. The start time is to
# the millisecond and <suffix> is 4 random hex characters, so two runs started
# together on one machine still get folders of their own. The folder name is
# the run_id of the index; nothing parses it, readers use run.yaml.
#
# The record is written twice: `status: running` with the runner's pid before
# the first step, then rewritten whole with the final status when the run
# ends. Each write replaces the file through a temp file and a rename, so a
# reader never sees half of it. A runner that fails after the start ends the
# record as `error` ("runner stopped: ..."). Only a killed runner leaves its
# `running` record behind; a reader that finds its pid gone reads it as lost.
#
# A reader (a UI, a sweep) needs only this file. `sweep_runs` (scripts/tree.py)
# deletes the folder once `keep` has passed since finished_at (else
# started_at), for every lib's records in the store. A folder without a
# readable run.yaml is not a record and is never swept.

run:
  lib: ""                     # Always "SiteMapper" here; the runs root is shared by libs
  owner: ""                   # Project path under projects/, or the site name
  workflow: ""                # Workflow name
  tier: ""                    # The tier the run targeted, or "-"
  instance: ""                # Machine the run happened on (hostname or SITEMAPPER_INSTANCE)
  started_at: ""              # ISO-8601 UTC
  finished_at: ""             # ISO-8601 UTC; for a waiting run, when it paused.
                              # Absent while status is running
  status: ""                  # running | passed | failed | error | waiting
                              # (the final one mirrors result.json)
  trigger: ""                 # schedule | manual | ui: run.py --trigger, default manual
  pid: 0                      # Process id of the runner on its instance
  keep: ""                    # How long the folder lives: <N>d (days),
                              # <N>h (hours), or "keep" (never swept). Copied
                              # from the project's `keep:`, else "1d"; empty or
                              # unparseable also means one day. A run a report
                              # cites is kept by setting "keep" here. The run
                              # that set the workflow's trust to broken gets
                              # "keep" from the runner: it is the evidence for
                              # the flag. Whoever restores trust deletes the
                              # folder or lowers its keep.
  headline: ""                # One line for a runs list, at most 200 characters:
                              # status, the waiting step, assertion counts and
                              # the first two summary entries
  error: ""                   # status error or failed: the result's error, or
                              # the first failed assertion, one line
  waiting_for: {}             # status waiting: {step, label, reason} from result.json
  trust_change: ""            # Set when this run changed the workflow's trust,
                              # e.g. "draft -> broken"
  assertions: {}              # {total, passed, failed}: the result's counts
  summary: []                 # The captures as [{label, value}] strings: nested
                              # maps flatten to dotted labels ("scan.fleet.total"),
                              # anything else is one value (JSON unless a string).
                              # At most 30 entries, values cut at 200 characters
  files: []                   # Relative paths of everything in the folder; only
                              # run.yaml while running
#
# The optional keys (trigger to summary) are left out when empty, e.g. a
# result.json an agent wrote without captures or counts has no summary.
#
# Index: every write of the record also appends one JSON line to
# <runs>/SiteMapper/index.<instance>.jsonl: run_id (the folder name) plus
# owner, workflow, tier, instance, started_at, finished_at, status, trigger,
# pid, headline and trust_change as above. A run has a `running` line and a
# final line with the same run_id; the later line supersedes the earlier. One file per instance, appended under
# an exclusive file lock so parallel runs on one machine never interleave, and
# never swept: sweep_runs touches only folders holding a run.yaml.
#
# Key names and types are owned by the run-record contract of the deployment
# (connectOS contracts/run-record.yaml); this template follows it.
