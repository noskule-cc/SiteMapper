# Schema: Run Record
# What the headless runner writes when a run is recorded (--record, or always
# when the workflow declares `rollback: snapshot`). One folder per run:
#
#   <runs>/SiteMapper/<owner>/<workflow>.<YYYY-MM-DDTHHMMSSZ>.<tier>.<instance>/
#     run.yaml          this record
#     result.json       the full `result` object (schema/result.yaml)
#     snapshot/         captures of the `snapshot:` phase, one JSON file each
#     evidence/         screenshots and files the run produced
#
# <runs> is the runs root (scripts/tree.py): `runs/` beside the lib's tree in a
# deployment's data tree, or inside the framework repo. It is produced data —
# gitignored as a class, never committed. <owner> is the project's path under
# projects/ or the site's name. <tier> is `-` when the workflow declares no
# tiers. The instance in the folder name is what keeps two machines' runs
# apart; a sync copies folders and never merges them.
#
# A reader (a UI, a sweep) needs only this file. `sweep_runs` (scripts/tree.py)
# deletes the folder once `keep` has passed since finished_at (else
# started_at), for every lib's records in the store. A folder without a
# readable run.yaml is not a record and is never swept.

run:
  lib: ""                     # Always "SiteMapper" here; the runs root is shared by libs
  owner: ""                   # Project path under projects/, or the site name
  workflow: ""                # Workflow name
  tier: ""                    # The tier the run targeted, or "-"
  instance: ""                # Machine the run happened on (hostname or SITEMAPPER_INSTANCE)
  started_at: ""              # ISO-8601 UTC
  finished_at: ""             # ISO-8601 UTC
  status: ""                  # passed | failed | error (mirrors result.json)
  keep: ""                    # How long the folder lives: <N>d (days),
                              # <N>h (hours), or "keep" (never swept). Copied
                              # from the project's `keep:`, else "1d"; empty or
                              # unparseable also means one day. A run a report
                              # cites is kept by setting "keep" here.
  files: []                   # Relative paths of everything in the folder
