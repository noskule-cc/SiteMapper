# Global SiteMapper configuration.
# Baseline settings inherited by every site and page. More-specific scopes
# (sites/<site>/site.yaml, then sites/<site>/pages/<page>.yaml) override these
# per key. See schema/settings.yaml for the full definition.
#
# ⛔ NO CONTACT BLOCK HERE, DELIBERATELY. This repository is public, and
# settings.contact is a real person's name, e-mail and phone number - the values
# that get typed into live forms. It lives in your own private map repository
# instead, as its config.yaml, and is deep-merged over this file at the same
# global scope (see data/README.md):
#
#     <your-maps>/config.yaml       (private)  settings.contact
#       └─ config.yaml              (this file, public)  settings.policy
#            └─ sites/<site>/site.yaml
#                 └─ sites/<site>/pages/<page>.yaml
#
# A workflow that needs to fill an identity field reads settings.contact and
# will find nothing if that repository is not cloned beside this one. That is
# the intended failure: it stops, rather than inventing a person.

settings:
  policy:
    environment: production     # default-safe; dev/staging sites opt in below their own site.yaml
    permissions:                # allow | ask | deny per action class — see docs/PERMISSIONS.md
      read: allow               # reading changes nothing
      write: ask                # never create/edit (incl. form submits) without asking
      auth: ask                 # automated login is an opt-in, per environment
      destructive: deny         # deleting what a run did not create: never by default
    safe_to_submit_forms: false # legacy alias of permissions.write — kept for old maps
