site:
  name: GG+connect IoT Portal
  base_url: https://connect.ggplus.ch
  description: IoT portal for managing commercial kitchen equipment (dishwashers), users, and service requests
  auth_notes: SSO login, user Benjamin Behringer has admin access
  mapped_at: "2026-04-30"
  pages:
    # Navigation
    - dashboard.yaml
    # Dienste
    - dienste-wartungsabonnemente.yaml
    - dienste-service.yaml
    - dienste-garantien.yaml
    - dienste-montageabklaerung.yaml
    - dienste-uebergabeprotokoll.yaml
    # Kontakt
    - kontakt-stoerung-melden.yaml
    - kontakt-kontaktformular.yaml
    # Geräte
    - maschinenpark.yaml
    - geraet-detail.yaml
    - geraete-stoerungsmeldungen.yaml
    # Shop
    - shop-produkte.yaml
    - shop-bestellungen.yaml
    # Community
    - community-partner.yaml
    # Einstellungen
    - einstellungen-profil.yaml
    - einstellungen-dashboard.yaml
    - einstellungen-benachrichtigungen.yaml
    # Adminbereich
    - admin-benutzerverwaltung.yaml
    - admin-rollenverwaltung.yaml
    - admin-benachrichtigungsverwaltung.yaml
    - admin-gateway-monitoring.yaml
    - partner-wechseln.yaml
    # System
    - logs.yaml
  workflows:
    - switch-partner-to-maschinenpark.yaml
    # Cross-site workflows that also use this site live under projects/:
    #   projects/gateway-audit/workflows/gateway-update-effect-tracking.yaml
    #   projects/gateway-audit/workflows/gateway-online-status.yaml

  # Direct API access to the GG+connect BFF (https://bff.ggplus.ch), so workflows
  # can read data without driving/scraping the browser. See scripts/README.md.
  # Auth: real login (POST /user/api/v1/auth), credentials in the OS keyring.
  scripts:
    - name: ggplus_auth.py
      description: Login + token refresh (OS keyring). Run once interactively; other scripts reuse it.
    - name: ggplus_api.py
      description: >
        API client — fleet list, connect Status via the SignalR hub, Headwind logs
        and infos, partner names. Not a CLI; imported by the scripts below.
    - name: get_gateway_status_table.py
      description: >
        Full gateway fleet with each gateway assigned an action bucket
        (gateway_online_status decision tree). Replaces the DOM scrape of
        admin-gateway-monitoring. Outputs a summary, --json, or --csv.
    - name: get_gateway_logs.py
      description: >
        Headwind (HMDM) device logs, WARNING+ERROR only, with a diagnosis of WHY the
        gateway is unreachable. Backs the "Analyse Logs from Headwind" workflow node.
