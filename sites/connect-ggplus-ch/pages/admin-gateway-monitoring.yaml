page:
  name: Adminbereich - Gateway Monitoring
  url_pattern: /adminbereich/gateway-monitoring
  purpose: >
    Monitor IoT gateway device connection status across all partners. Central
    view correlating the gateway's own connection Status, the Headwind
    management-channel status, firmware Version, and identity (Seriennummer,
    Vertragsnummer). Source of truth for gateway-update / connectivity audits.

  elements:
    # Status overview cards (clickable to filter)
    - name: verbunden-card
      type: container
      locator:
        strategy: text
        value: Verbunden
      description: Green card with count of connected gateways (e.g. 96)

    - name: offline-card
      type: container
      locator:
        strategy: text
        value: Offline
      description: Red card with count of offline gateways (e.g. 255)

    - name: unkonfiguriert-card
      type: container
      locator:
        strategy: text
        value: Unkonfiguriert
      description: Grey card with count of unconfigured gateways (e.g. 21)

    # Filters
    - name: status-filter
      type: select
      locator:
        strategy: text
        value: Status
      description: >
        Multi-select dropdown filtering the table by gateway Status. Options:
        Unkonfiguriert, Verbunden, Offline. Default selection is all three.

    - name: text-filter
      type: input
      locator:
        strategy: text
        value: Filter
      description: Free text filter applied across the gateway table

    # Actions
    - name: csv-export-button
      type: button
      locator:
        strategy: text
        value: CSV Export
      description: >
        Red button exporting the currently filtered gateway table as CSV. It exports
        10 columns: Status, Zeitpunkt, Status Headwind, Vertragsnummer, Hersteller,
        Interner Name, Interne Notiz, Seriennummer, Version, SimKarte/WiFi.
        NOT an API call — the file is built in the browser
        (exportAsCsv(dataSource.filteredData) -> convertToCSV() -> new Blob(...)),
        so there is no CSV endpoint to request. For automation do NOT click this;
        use scripts/get_gateway_status_table.py, which reproduces the same columns
        from the API. See scripts/README.md.

    # Table
    - name: gateway-table
      type: table
      locator:
        strategy: css
        value: "table"
      description: >
        One row per gateway. Columns (left to right): Status, Zeitpunkt,
        Status Headwind, Vertragsnummer, Vertragspartner, Interner Name,
        Interne Notiz, Seriennummer, Installationsdatum, Version, SimKarte/WiFi,
        plus per-row history and detail icons.

    # Key columns (documented individually because the audit workflow keys on them)
    - name: col-status
      type: text
      locator:
        strategy: text
        value: Status
      description: >
        Gateway connection status shown as a ROUTER ICON, colour-coded:
        green = Verbunden (connected/online), red = Offline, grey = Unkonfiguriert.
        This is the gateway's own reported connectivity.

    - name: col-status-headwind
      type: text
      locator:
        strategy: text
        value: Status Headwind
      description: >
        Headwind management-channel status shown as a coloured DOT:
        green = online, red = offline, yellow = warning/partial,
        grey = not reporting / unknown (typically older firmware without Headwind).
        Independent of col-status.

    - name: col-vertragsnummer
      type: text
      locator:
        strategy: text
        value: Vertragsnummer
      description: >
        Contract number identifying the end customer. Internal/test contracts
        (1000, 10000, 3086769) are typically excluded from fleet audits.

    - name: col-version
      type: text
      locator:
        strategy: text
        value: Version
      description: >
        Gateway firmware version (e.g. 1.14.1.0, 1.15.1.2, 1.15.1.3, 1.15.2.4).
        May be empty for gateways that never reported a version. Compare as a
        dotted numeric tuple, not as a string (1.15.1.10 > 1.15.1.2).

    - name: col-seriennummer
      type: text
      locator:
        strategy: text
        value: Seriennummer
      description: >
        Gateway serial number. Join key to the Swisscom M2M portal, where it is
        stored in the "Gateway Ausprägung" field of the SIM subscription.

  gotchas:
    - "PREFER THE API OVER THIS PAGE. Everything below is reachable directly from the BFF — see scripts/get_gateway_status_table.py. Drive the browser only if you specifically need to test the UI."
    - Page takes a few seconds to load (shows a red spinner) before the table appears.
    - Two distinct status indicators — do not conflate them. "Status" (router icon) is the gateway's connectivity; "Status Headwind" (dot) is the management-channel status. They can disagree (e.g. Headwind green while Status red).
    - Status icon colours — green = Verbunden, red = Offline, grey = Unkonfiguriert. Headwind dot colours — green = online, red = offline, yellow = warning, grey = not reporting.
    - The three status cards at the top are clickable and filter the table.
    - Table columns are sortable by clicking the header.
    - Compare Version numerically per dotted segment, not lexically (1.15.1.10 > 1.15.1.2).
    - Version can be empty — that means "no version reported at all", which is NOT the same as "old version". Bucket it separately rather than treating it as outdated.
    - The Seriennummer here corresponds to "Gateway Ausprägung" on the Swisscom M2M portal (portal-m2m-swisscom-ch site) — use it to cross-check SIM status and last-24h traffic.

    # --- API-level gotchas (verified 2026-07-13 against the live app) ---
    - "The 'Version' column is a HYBRID field, not one property: it shows hmdmConnectVersionInstalled UNLESS Status Headwind is grey, in which case it shows firmwareVersion. Reading firmwareVersion naively gives a different, wrong answer (e.g. serial 2023010300000004 has firmwareVersion 1.14.1.0 but displays 1.15.0.3). Reproduce the app's getDisplayedVersion() exactly."
    - "connectionState from GET /gateway/api/v1/gateway/all is a PLACEHOLDER — it is \"Unconfigured\" for every gateway. The real Status arrives over the SignalR hub /gateway/device-connection: invoke AddDeviceWatcher(deviceId, classification) and the server pushes a ConnectionState message ({deviceId, deviceIotConnectionStatus}). A plain HTTP call cannot tell you whether a gateway is online."
    - "The CSV Export button is NOT an API call — the file is generated in the browser from data already in memory. There is no CSV endpoint."
    - "internetConnectionType (SimCard / Wifi / null) decides whether an LTE traffic check is even meaningful — a WiFi gateway has no SIM and must not be sent down the LTE branch."
    - "Headwind logs: POST /gateway/api/v1/hmdm/logs. Its `severity` filter is CUMULATIVE, not an exact level — severity=2 returns WARNING+ERROR only (and drops ~92% of the volume server-side)."
