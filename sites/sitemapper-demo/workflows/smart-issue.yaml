workflow:
  name: "smart-issue"
  description: "Ask what the issue is about, search for similar existing issues, present matches or create a new one"
  site: "sitemapper-demo"

  mode: agentic           # the `verify` step below judges whether existing issues
                          # are similar enough and asks the user before creating
  trust: draft            # agentic — can never become `verified` for blind runs
  effect: mutating        # creates an issue

  parameters:
    - name: "topic"
      type: text
      description: "What is the issue about? (used to search and as title if creating)"
      required: true

    - name: "label"
      type: select
      description: "Label to apply if a new issue is created"
      required: false
      options:
        - bug
        - documentation
        - duplicate
        - enhancement
        - good first issue
        - help wanted
        - invalid
        - question
        - wontfix
      default: "bug"

  steps:
    - action: navigate
      page: "issues-list"
      description: "Go to the issues list"

    - action: input
      page: "issues-list"
      element: "search-input"
      value: "$topic"
      description: "Type the topic into the issue search"

    - action: key
      page: "issues-list"
      value: "Enter"
      description: "Apply the search — typing alone does not filter (see page gotcha); Enter navigates to ?q=<topic>"

    - action: read
      page: "issues-list"
      element: "issues-list"
      capture: "search_results"
      description: "Read the FILTERED results list to find similar issues"

    - action: verify
      description: >
        Present the search results to the user. If similar issues exist, show
        them and ask whether to still create a new one. If the user declines,
        STOP HERE — do not execute any of the remaining steps. Only proceed to
        create when there are no similar issues or the user explicitly
        confirms. (The remaining steps are the create branch; the schema has no
        conditional steps yet, so this early exit is the branch.)

    - action: navigate
      page: "new-issue"
      description: "Navigate to the new issue form"

    - action: input
      page: "new-issue"
      element: "title-input"
      value: "$topic"
      description: "Enter the issue title"

    - action: input
      page: "new-issue"
      element: "description-input"
      value: "Issue created via SiteMapper smart-issue workflow."
      description: "Enter a default description"

    - action: click
      page: "new-issue"
      element: "labels-gear"
      description: "Open the labels dropdown"

    - action: input
      page: "new-issue"
      element: "labels-filter"
      value: "$label"
      description: "Filter to the selected label"

    - action: click
      page: "new-issue"
      element: "label-option"
      value: "$label"
      description: "Select the label checkbox"

    - action: click
      page: "new-issue"
      element: "create-button"
      description: "Submit the new issue"

  verify:
    - "If the run reached the create branch: the issue appears in the issues list with the correct title and label"
    - "If the user declined at the similar-issues check: no issue was created (the run stopped at the verify step)"
